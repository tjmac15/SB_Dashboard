<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://login.microsoftonline.com https://graph.microsoft.com; img-src 'self' data:; frame-src https://login.microsoftonline.com">
<title>Vestas SAP Security & Compliance Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#eef1f6;--surface:#fff;--surface2:#f5f7fa;--surface3:#e9edf3;
  --border:#dfe4ec;--border-lt:#c9d1de;
  --fg:#152238;--fg2:#5c6b82;--fg3:#8b96a8;
  --accent:#00b5e4;--accent2:#0093ba;--accent-dim:rgba(0,181,228,.12);--accent-glow:rgba(0,181,228,.35);
  --sec:#c9922e;--sec-dim:rgba(201,146,46,.14);
  --hdr:#fff;--hdr2:#fff;
  --sys-bg:rgba(0,181,228,.1);--sys-fg:#007a9c;
  --radius:6px;--sw:224px;
  --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;
}
html,body{width:100%;min-width:100%;height:100%;font-family:var(--sans);background:var(--bg);color:var(--fg);font-size:21px;overflow:hidden;display:flex}
body{background-image:linear-gradient(rgba(0,181,228,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,181,228,.04) 1px,transparent 1px);background-size:34px 34px}
/* ── Sidebar ── */
#sidebar{width:var(--sw);min-width:var(--sw);height:100vh;background:var(--hdr);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
.sb-brand{display:flex;flex-direction:column;gap:7px;padding:18px 16px 14px;border-bottom:1px solid var(--border)}
.sb-logo-wrap{height:36px;display:flex;align-items:center}
.sb-logo-img{height:100%;width:auto;max-width:170px;object-fit:contain;object-position:left center}
.sb-logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#00b5e4,#e8c082);display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:700;color:#0b1420;flex-shrink:0;box-shadow:0 0 16px var(--accent-dim)}
.sb-logo-img{width:32px;height:36px;object-fit:contain;flex-shrink:0}
.sb-brand-t{font-weight:700;font-size:17px;color:var(--fg);letter-spacing:-.2px}
.sb-brand-s{font-size:12px;color:var(--fg3)}
.sb-sec{font-size:12px;font-weight:700;letter-spacing:1px;color:var(--fg3);padding:14px 18px 6px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:10px;width:calc(100% - 16px);padding:9px 10px 9px 18px;font:inherit;font-size:16px;text-align:left;color:var(--fg2);background:none;border:0;border-left:2px solid transparent;border-radius:var(--radius);cursor:pointer;margin:1px 8px;transition:all .12s}
.nav-item:hover{background:var(--surface2);color:var(--fg);border-left-color:var(--border-lt)}
.nav-item.active{background:var(--accent-dim);color:var(--accent2);font-weight:600;border-left-color:var(--accent)}
.nav-item:focus-visible,.auth-btn:focus-visible,.sync-btn:focus-visible,.welcome-btn:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid rgba(0,181,228,.35);outline-offset:2px}
.nav-icon{width:16px;text-align:center;font-size:16px}
.sb-div{height:1px;background:var(--border);margin:8px 0}
.sb-ctrl{padding:0 14px}
.sb-lbl{font-size:14px;font-weight:700;color:var(--fg2);margin-bottom:4px;display:block}
.sb-ctrl select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:5px 8px;font-size:16px;color:var(--fg);font-family:var(--sans);appearance:none;margin-bottom:10px;cursor:pointer}
.sb-ctrl input[type=range]{width:100%;accent-color:var(--accent);cursor:pointer;height:4px;margin-bottom:14px}
.wk-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.wk-val{font-size:15px;font-weight:700;color:var(--fg);font-family:var(--mono)}
/* ── Auth ── */
.auth-area{padding:0 14px 14px}
.auth-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:10px 12px;border:none;border-radius:var(--radius);font-size:16px;font-weight:600;cursor:pointer;font-family:var(--sans);transition:all .15s;margin-bottom:6px}
.auth-btn.primary{background:var(--accent);color:#fff}
.auth-btn.primary:hover{background:var(--accent2)}
.auth-btn.danger{background:rgba(220,38,38,.15);color:#b91c1c}
.spin{width:13px;height:13px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite;display:none}
.auth-btn.busy .spin{display:block}
@keyframes rot{to{transform:rotate(360deg)}}
.user-card{display:none;align-items:center;gap:8px;padding:8px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px}
.user-card.show{display:flex}
.user-av{width:28px;height:28px;border-radius:50%;background:var(--accent-dim);color:var(--accent2);border:1px solid var(--accent-dim);font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.user-nm{font-size:15px;font-weight:500;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-org{font-size:12px;color:var(--fg3)}
.sync-row{display:flex;align-items:center;justify-content:space-between;margin-top:2px;display:none}
.sync-row.show{display:flex}
.sync-time{font-size:12px;color:var(--fg3)}
.sync-btn{font-size:14px;font-weight:600;color:var(--accent);background:none;border:none;cursor:pointer;padding:2px 4px;border-radius:3px}
.sync-btn:hover{background:var(--accent-dim)}
/* ── Main ── */
#content{flex:1;width:calc(100vw - var(--sw));display:flex;flex-direction:column;overflow:hidden;min-width:0}
#topbar{background:var(--hdr2);padding:0 24px;height:54px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:relative;overflow:hidden;border-bottom:1px solid var(--border)}
#topbar::after{content:'';position:absolute;bottom:0;left:0;width:36%;height:1px;background:linear-gradient(90deg,transparent,var(--accent2),transparent);animation:scan 5s linear infinite}
@keyframes scan{0%{transform:translateX(-100%)}100%{transform:translateX(180%)}}
.topbar-l{display:flex;align-items:center;gap:10px}
#vt-hdr{color:var(--fg);font-size:20px;font-weight:700;font-family:var(--mono)}
.src-chip{font-size:14px;background:var(--surface2);border:1px solid var(--border);color:var(--sys-fg);padding:3px 9px;border-radius:20px;display:none;font-family:var(--mono)}
.src-chip.show{display:inline}
#tu{font-size:15px;color:var(--fg3);display:none;font-family:var(--mono)}
#tu.show{display:block}
/* ── Banners ── */
.banner{margin:8px 24px 0;padding:9px 14px;border-radius:var(--radius);font-size:16px;display:none;align-items:center;gap:10px;border:1px solid}
.banner.show{display:flex}
.banner.err{background:rgba(220,38,38,.13);border-color:rgba(220,38,38,.4);color:#b91c1c}
.banner.ok{background:rgba(52,211,153,.15);border-color:rgba(22,163,74,.4);color:#15803d}
.banner.info{background:var(--accent-dim);border-color:rgba(0,181,228,.4);color:#0093ba}
.bx{margin-left:auto;cursor:pointer;opacity:.5}
.bx:hover{opacity:1}
/* ── KPI cards ── */
#cards{display:flex;gap:10px;padding:10px 24px 8px;flex-shrink:0}
.card{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.card-bar{height:3px}
.card-body{padding:10px 13px}
.card-lbl{font-size:14px;font-weight:700;color:var(--fg3);letter-spacing:.6px;text-transform:uppercase;margin-bottom:4px}
.card-val{font-size:31px;font-weight:700;font-family:var(--mono);line-height:1;text-shadow:0 0 16px currentColor}
.card-sub{font-size:14px;color:var(--fg3);margin-top:3px}
/* ── View bar ── */
#view-bar{display:flex;align-items:center;justify-content:space-between;padding:2px 24px 6px;flex-shrink:0}
#vt{font-size:16px;font-weight:700;color:var(--fg);letter-spacing:.5px}
#legend{display:flex;gap:6px}
.lpill{font-size:14px;font-weight:700;padding:3px 9px;border-radius:20px}
/* ── Hosts ── */
#chart-host{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin:0 24px 18px;padding:18px;overflow:auto;display:none}
#html-host{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin:0 24px 18px;overflow:auto;display:none}
#html-host.flush{background:none;border:0;overflow-y:auto;overflow-x:hidden;padding:0}
.chart-container{position:relative;height:400px;padding:6px}
/* Heatmap detail view */
.heatmap-layout{display:grid;grid-template-columns:minmax(0,1fr) 480px;min-height:100%;height:100%}
.heatmap-main{min-width:0;display:flex;flex-direction:column}.heatmap-toolbar{display:flex;align-items:end;justify-content:space-between;gap:14px;padding:16px 18px 8px;border-bottom:1px solid var(--border)}
.heatmap-toolbar label{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:700;color:var(--fg2);letter-spacing:.5px;text-transform:uppercase}.heatmap-toolbar select{min-width:240px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:7px 9px;color:var(--fg);font:inherit;font-size:16px}
.heatmap-hint{font-size:15px;color:var(--fg3);padding-bottom:7px}.heatmap-main .hm-wrap{flex:1}
.rating-summary{padding:18px;border-left:1px solid var(--border);background:var(--surface2);overflow:auto}.rating-summary h3{font-size:14px;letter-spacing:.7px;text-transform:uppercase;color:var(--fg2);margin-bottom:15px}.rs-cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}.rs-col{min-width:0}
.rating-score{padding:18px 14px;border-radius:var(--radius);text-align:center;margin-bottom:14px;border:1px solid transparent}.rating-score.good{background:rgba(52,211,153,.14);color:#16a34a;border-color:rgba(52,211,153,.3)}.rating-score.warning{background:rgba(251,191,36,.14);color:#d97706;border-color:rgba(251,191,36,.3)}.rating-score.critical{background:rgba(220,38,38,.15);color:#b91c1c;border-color:rgba(220,38,38,.35)}.rating-score.empty{background:var(--surface3);color:var(--fg3)}
.rating-score .score{font-family:var(--mono);font-size:56px;line-height:1;font-weight:700}.rating-score .label{font-size:14px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;margin-top:6px}
.rating-counts{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:17px}.rating-count{background:var(--surface3);border:1px solid var(--border);border-radius:var(--radius);padding:8px;text-align:center}.rating-count strong{display:block;font:700 26px/1 var(--mono)}.rating-count span{font-size:12px;color:var(--fg3);text-transform:uppercase}.rating-count.critical strong{color:#dc2626}.rating-count.warning strong{color:#d97706}.rating-count.good strong{color:#16a34a}
.rating-list-title{font-size:14px;font-weight:700;color:var(--fg2);text-transform:uppercase;letter-spacing:.6px;margin:4px 0 7px}.rating-list{list-style:none}.rating-list li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);font-size:15px;color:var(--fg2)}.rating-list li span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rating-pill{font:700 14px var(--mono);min-width:30px;text-align:center;padding:3px 5px;border-radius:4px}.rating-pill.good{background:rgba(52,211,153,.15);color:#16a34a}.rating-pill.warning{background:rgba(251,191,36,.15);color:#d97706}.rating-pill.critical{background:rgba(220,38,38,.16);color:#b91c1c}.rating-pill.empty{background:var(--surface3);color:var(--fg3)}
.rating-list.systems li{gap:10px}.sys-bar-track{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden;min-width:0}.sys-bar-fill{height:100%;border-radius:3px}.sys-bar-name{flex:0 0 auto;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ── Merged Overview grid ── */
.ov-grid{display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:auto 400px 400px;gap:10px;min-height:0}
.ov-heatmap{grid-column:1 / -1;grid-row:1;min-height:0;max-height:none}
.ov-heatmap .heatmap-layout{height:auto;min-height:0}
.ov-heatmap .hm-wrap{overflow-x:auto;overflow-y:visible;max-height:none;padding-bottom:16px}
.ov-heatmap .rating-summary{overflow:visible;max-height:none}
.ov-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden;min-height:0}
.ov-panel-hd{padding:9px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:10px}
.ov-panel-hd h3{font-size:14px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--fg2)}
.ov-panel-leg{display:flex;gap:5px;flex-shrink:0}
.ov-chart{flex:1;position:relative;padding:8px 10px;min-height:0}
.ov-chart canvas{width:100% !important;height:100% !important}
.ov-heatmap .heatmap-layout{height:100%}
.ov-heatmap .heatmap-toolbar{padding:9px 14px}
.ws-stack{display:flex;flex-direction:column;gap:10px}
.ws-stack .ov-panel{overflow:visible}
.ws-stack .wow-wrap,.ws-stack .spk-wrap{overflow:visible;padding:6px}
/* ── Tables ── */
.hm-wrap{overflow:auto;padding:8px}
table.hm{border-collapse:separate;border-spacing:2px;font-size:15px;font-family:var(--mono);width:100%;height:100%}
table.hm tbody tr{height:1px}
table.hm .sc{height:100%;display:flex;align-items:center;justify-content:center}
table.hm .mo-row th{background:var(--hdr);color:var(--accent2);padding:6px 4px;font-size:14px;font-weight:700;text-align:center}
table.hm .mo-row th.at{text-align:left;min-width:200px;padding-left:12px;color:var(--sys-fg);font-size:17px;font-weight:700}
table.hm .cw-row th{background:var(--hdr);color:var(--fg2);padding:6px 5px;font-size:15px;font-weight:700;text-align:center;white-space:nowrap}
table.hm .cw-row th.at{text-align:left;padding-left:12px}
table.hm .sys-row td{background:var(--sys-bg);color:var(--sys-fg);font-weight:700;font-size:15px;padding:6px 12px;font-family:var(--sans)}
table.hm .dr td{padding:2px}
table.hm .dr td.at{padding:2px 12px;font-size:15px;white-space:nowrap;color:var(--fg2);font-family:var(--sans)}
table.hm .dr td.at.ir{font-weight:700;color:var(--fg);border-left:3px solid var(--sec)}
table.hm .dr:nth-child(odd) td{background:var(--surface2)}
.sc{display:block;border-radius:4px;padding:3px 2px;min-width:36px;text-align:center;font-weight:600;font-size:14px}
.sg{background:rgba(52,211,153,.15);color:#16a34a}.sw{background:rgba(251,191,36,.15);color:#d97706}
.sr{background:rgba(220,38,38,.16);color:#b91c1c}.sn{background:var(--surface3);color:var(--fg3)}
/* ── WoW ── */
.wow-wrap{padding:8px;overflow:auto}
table.wow{border-collapse:separate;border-spacing:2px;font-size:15px;width:100%}
table.wow thead th{background:var(--hdr);color:var(--fg2);padding:8px 10px;font-size:12px;font-weight:700;white-space:nowrap;text-align:center;font-family:var(--mono)}
table.wow thead th.wa{text-align:left;min-width:220px;padding-left:14px}
table.wow .ws td{background:var(--sys-bg);color:var(--sys-fg);font-weight:700;font-size:15px;padding:6px 12px;font-family:var(--sans)}
table.wow .wr td{padding:4px;vertical-align:middle}
table.wow .wr td.wac{padding:4px 14px;font-size:15px;color:var(--fg2);font-family:var(--sans);white-space:nowrap}
table.wow .wr td.wac.ir{font-weight:700;color:var(--fg);border-left:2px solid var(--sec)}
table.wow .wr:nth-child(odd) td{background:var(--surface2)}
.dp{display:inline-block;border-radius:8px;padding:3px 10px;font-size:14px;font-weight:700;font-family:var(--mono);white-space:nowrap;width:100%;text-align:center}
.du{background:rgba(52,211,153,.15);color:#16a34a}.dd{background:rgba(220,38,38,.16);color:#b91c1c}
.de{background:var(--surface3);color:var(--fg2)}.dn{background:transparent;color:var(--fg3)}
/* ── Sparklines ── */
.spk-wrap{overflow:auto;padding:8px}
table.spk{border-collapse:separate;border-spacing:2px;font-size:15px;width:100%}
table.spk thead th{background:var(--hdr);color:var(--fg2);padding:7px 8px;font-size:12px;font-weight:700;white-space:nowrap;text-align:center}
table.spk thead th.sa{text-align:left;min-width:190px;padding-left:14px}
table.spk .ss td{background:var(--sys-bg);color:var(--sys-fg);font-weight:700;font-size:15px;padding:6px 12px;font-family:var(--sans)}
table.spk .sr2 td{padding:3px 4px;vertical-align:middle}
table.spk .sr2 td.sac{padding:3px 14px;color:var(--fg2);font-size:15px;white-space:nowrap;font-family:var(--sans)}
table.spk .sr2 td.sac.ir{font-weight:700;color:var(--fg);border-left:3px solid var(--sec)}
table.spk .sr2:nth-child(odd) td{background:var(--surface2)}
.sbadge{display:inline-block;border-radius:20px;padding:2px 8px;font-size:14px;font-weight:700;font-family:var(--mono)}
.strend{display:inline-block;font-size:20px;font-weight:700}
/* ── Overlay ── */
#overlay{position:fixed;inset:0;background:rgba(3,7,14,.88);display:none;align-items:center;justify-content:center;z-index:200;flex-direction:column;backdrop-filter:blur(2px)}
#overlay.show{display:flex}
.ov-box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:36px 52px;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.5)}
.ov-spin{width:44px;height:44px;border:4px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:rot .8s linear infinite;margin:0 auto 18px}
.ov-t{font-size:20px;font-weight:600;color:var(--fg);margin-bottom:5px}
.ov-s{font-size:16px;color:var(--fg3)}
/* ── Welcome ── */
.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;padding:40px}
.welcome-icon{font-size:64px;margin-bottom:20px}
.welcome-title{font-size:24px;font-weight:700;color:var(--fg);margin-bottom:8px}
.welcome-sub{font-size:17px;color:var(--fg2);line-height:1.6;max-width:360px;margin-bottom:28px}
.welcome-btn{display:inline-flex;align-items:center;gap:10px;padding:13px 28px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);font-size:18px;font-weight:600;cursor:pointer;font-family:var(--sans);box-shadow:0 4px 14px rgba(0,181,228,.35)}
.welcome-btn:hover{background:var(--accent2)}
.ms-logo{width:18px;height:18px;flex-shrink:0}
*{scrollbar-width:auto;scrollbar-color:var(--accent2) var(--surface2)}
::-webkit-scrollbar{width:16px;height:16px}
::-webkit-scrollbar-track{background:var(--surface2);border-radius:8px}
::-webkit-scrollbar-thumb{background:var(--accent2);border-radius:8px;border:3px solid var(--surface2);min-height:32px}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}
.hm-wrap::-webkit-scrollbar{height:20px}
.hm-wrap::-webkit-scrollbar-thumb{border-width:4px;min-width:60px}
@media (max-width:760px){
  html,body{height:auto;min-height:100%;overflow:auto;display:block}
  #sidebar{width:100%;min-width:0;height:auto;max-height:none;border-right:0;border-bottom:1px solid var(--border)}
  .sb-brand{padding:12px 16px}.sb-sec{padding-top:10px}
  #nav-items{display:flex;overflow-x:auto;padding:0 8px}.nav-item{width:auto;flex:0 0 auto;margin:1px 2px;padding:8px 10px}
  .nav-icon{width:auto}.auth-area{padding-bottom:10px}.sb-ctrl{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.sb-ctrl .wk-row,.sb-ctrl input[type=range]{grid-column:1 / -1}
  #content{width:100%;min-height:calc(100vh - 1px);overflow:visible}#topbar{height:auto;min-height:52px;padding:12px 16px}.src-chip{display:none!important}
  #cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px}.card-body{padding:11px 12px}.card-val{font-size:29px}
  #view-bar{padding:2px 16px 10px;gap:8px;align-items:flex-start;flex-direction:column}#legend{flex-wrap:wrap}

}

<div id="overlay"><div class="ov-box"><div class="ov-spin"></div><div class="ov-t" id="ovt">Loading…</div><div class="ov-s" id="ovs">Please wait</div></div></div>

<script>
  
const CLIENT_ID = '2d62ed1b-5160-47c6-a26e-005e8f62006c';
const TENANT_ID = 'c0701940-7b3f-4116-a59f-159078bc3c63';

// SharePoint List config
const SP_HOST    = 'vestas.sharepoint.com';
const SP_SITE    = '/sites/DEP-IT-ISRMDashboard-005_SAPSECURITYHARDENING';
const SP_LIST    = 'SB_Scores';
// Keep delegated permissions to the minimum required by the current Graph calls.
// Files.Read.All was not used by this dashboard and has intentionally been removed.
const SCOPES     = ['Sites.Read.All','User.Read'];
const GRAPH      = 'https://graph.microsoft.com/v1.0';


function assertSafeRuntime(){
  const isLocal=['localhost','127.0.0.1','[::1]'].includes(window.location.hostname);
  if(!isLocal&&window.location.protocol!=='https:'){
    throw new Error('For security, this dashboard must be served over HTTPS.');
  }
}

// ════════════════════════════════════════════════════════
//  MSAL
// ════════════════════════════════════════════════════════
let msal_app = null;
try {
  msal_app = new msal.PublicClientApplication({
    auth: { clientId:CLIENT_ID, authority:`https://login.microsoftonline.com/${TENANT_ID}`,
            redirectUri:window.location.href.split('?')[0].split('#')[0] },
    cache: { cacheLocation:'sessionStorage' },
  });
} catch(e){ console.warn('MSAL init skipped'); }

// ════════════════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════════════════
let account=null, allBlocks=[], allColumns=[], activeView='overview', cwLimit=52;
let chartInsts=[], allItems=[], filteredYear='All Years';

const VIEWS=[
  {key:'overview',label:'Overview',icon:'▤'},
  {key:'wowspark',label:'Week-over-Week & Sparklines',icon:'#'},
];
const CC=['#00b5e4','#16a34a','#d97706','#dc2626','#a78bfa','#e8c082','#f472b6','#a3e635','#fb923c','#38bdf8','#818cf8','#2dd4bf','#facc15','#fb7185','#c084fc'];
if(window.Chart){Chart.defaults.color='#5c6b82';Chart.defaults.borderColor='#dfe4ec';Chart.defaults.font.family="'IBM Plex Sans',sans-serif";}

// ════════════════════════════════════════════════════════
//  AUTH
// ════════════════════════════════════════════════════════
async function init(){
  try{assertSafeRuntime();}catch(e){showWelcome();showErr(e.message);return;}
  if(!msal_app){showWelcome();return;}
  try{
    await msal_app.handleRedirectPromise();
    const accs=msal_app.getAllAccounts();
    if(accs.length){account=accs[0];onSignedIn();await loadData();}
    else showWelcome();
  }catch(e){showWelcome();showErr(e.message);}
}
async function toggleAuth(){if(account)doSignOut();else await doSignIn();}
async function doSignIn(){
  if(!msal_app){showErr('Set CLIENT_ID and TENANT_ID first.');return;}
  setBusy(true);
  try{const r=await msal_app.loginPopup({scopes:SCOPES,prompt:'select_account'});account=r.account;onSignedIn();await loadData();}
  catch(e){if(!e.message.includes('user_cancelled'))showErr('Sign-in failed: '+e.message);setBusy(false);}
}
function doSignOut(){msal_app.logoutPopup({account}).then(()=>{account=null;allBlocks=[];allColumns=[];allItems=[];onSignedOut();showWelcome();});}
async function getToken(){
  try{const r=await msal_app.acquireTokenSilent({scopes:SCOPES,account});return r.accessToken;}
  catch{const r=await msal_app.acquireTokenPopup({scopes:SCOPES});return r.accessToken;}
}
function onSignedIn(){
  const n=account.name||account.username;
  const i=n.split(' ').map(p=>p[0]).join('').slice(0,2).toUpperCase();
  document.getElementById('uc').classList.add('show');
  document.getElementById('uav').textContent=i;
  document.getElementById('unm').textContent=n;
  document.getElementById('abtn').className='auth-btn danger';
  document.getElementById('albl').textContent='🚪 Sign out';
  document.getElementById('tu').textContent=n;
  document.getElementById('tu').classList.add('show');
  setBusy(false);
}
function onSignedOut(){
  document.getElementById('uc').classList.remove('show');
  document.getElementById('abtn').className='auth-btn primary';
  document.getElementById('albl').textContent='🔑 Sign in with Microsoft';
  document.getElementById('tu').classList.remove('show');
  document.getElementById('syncrow').classList.remove('show');
  document.getElementById('sc2').classList.remove('show');
  document.getElementById('filtsep').style.display='none';
  document.getElementById('filtsec').style.display='none';
  document.getElementById('filtctrl').style.display='none';
  ['k1','k2','k3','k4'].forEach(id=>document.getElementById(id).textContent='--');
}
function setBusy(on){const b=document.getElementById('abtn'),s=document.getElementById('aspin');if(on){b.disabled=true;b.classList.add('busy');s.style.display='block';}else{b.disabled=false;b.classList.remove('busy');s.style.display='none';}}

// ════════════════════════════════════════════════════════
//  LOAD DATA FROM SHAREPOINT LIST
// ════════════════════════════════════════════════════════
async function loadData(){
  overlay('Connecting to SharePoint…','Loading score history');
  try{
    const token=await getToken();

    // Get site
    overlay('Fetching data…','Reading SB_Scores list');
    const siteR=await fetch(`${GRAPH}/sites/${SP_HOST}:${SP_SITE}`,{headers:{Authorization:`Bearer ${token}`}});
    if(!siteR.ok)throw new Error(`Site fetch failed: ${siteR.status}`);
    const site=await siteR.json();

    // Get list
    const listR=await fetch(`${GRAPH}/sites/${site.id}/lists?$filter=displayName eq '${SP_LIST}'`,{headers:{Authorization:`Bearer ${token}`}});
    if(!listR.ok)throw new Error(`List fetch failed: ${listR.status}`);
    const listD=await listR.json();
    if(!listD.value?.length)throw new Error(`List "${SP_LIST}" not found. Run the import script first.`);
    const listId=listD.value[0].id;

    // Fetch ALL items with pagination
    overlay('Loading history…','Fetching all weekly scores');
    let items=[],nextLink=`${GRAPH}/sites/${site.id}/lists/${listId}/items?$expand=fields&$top=999`;
    while(nextLink){
      const r=await fetch(nextLink,{headers:{Authorization:`Bearer ${token}`}});
      if(!r.ok)throw new Error(`Items fetch failed: ${r.status}`);
      const d=await r.json();
      items=[...items,...(d.value||[])];
      nextLink=d['@odata.nextLink']||null;
    }

    allItems=items.map(i=>{
      const score=Number.parseFloat(i.fields.Score);
      const year=Number.parseInt(i.fields.Year,10);
      const week=String(i.fields.Week||'').trim();
      return {
        system:String(i.fields.System||'').trim(), aor:String(i.fields.AoR||'').trim(),
        score:Number.isFinite(score)?score:null, week, year,
        period:`${year}|${week}`,
      };
    }).filter(i=>i.system&&i.aor&&i.week&&Number.isInteger(i.year)&&i.year>0&&i.score!==null);

    // Show filters
    document.getElementById('filtsep').style.display='block';
    document.getElementById('filtsec').style.display='block';
    document.getElementById('filtctrl').style.display='block';
    document.getElementById('sc2').classList.add('show');
    document.getElementById('syncrow').classList.add('show');
    document.getElementById('synct').textContent='Updated '+new Date().toLocaleTimeString();

    // Populate year selector
    const years=[...new Set(allItems.map(i=>i.year))].sort((a,b)=>b-a);
    const yrSel=document.getElementById('yr-sel');
    yrSel.innerHTML='<option>All Years</option>'+years.map(y=>`<option>${y}</option>`).join('');

    buildBlocks();
    hideOverlay();
    showOk(`✅ Loaded ${allItems.length} score records across ${years.length} year(s)`);
  }catch(e){hideOverlay();showErr('❌ '+e.message);console.error(e);}
}

function onYearChange(){
  filteredYear=document.getElementById('yr-sel').value;
  buildBlocks();
}

// ════════════════════════════════════════════════════════
//  BUILD BLOCKS (data structure for views)
// ════════════════════════════════════════════════════════
function buildBlocks(){
  // Filter by year
  const items=filteredYear==='All Years'?allItems:allItems.filter(i=>i.year===parseInt(filteredYear));

  // Get all unique weeks sorted
  const periods=[...new Set(items.map(i=>i.period))].sort((a,b)=>{
    const [yearA,weekA]=a.split('|'),[yearB,weekB]=b.split('|');
    return Number(yearA)-Number(yearB)||Number(weekA.replace(/\D/g,''))-Number(weekB.replace(/\D/g,''));
  });
  allColumns=periods.map((period,index)=>{
    const [year,cw]=period.split('|');
    return {cw,year:Number(year),month:cwToMonth(cw),period,index};
  });

  // Set weeks slider max
  const rng=document.getElementById('wkr');
  rng.min=Math.min(4,periods.length)||1;rng.max=periods.length;rng.value=periods.length;
  cwLimit=periods.length;
  document.getElementById('wkv').textContent=periods.length;

  // Build blocks grouped by system
  const sysMap={};
  items.forEach(item=>{
    if(!sysMap[item.system])sysMap[item.system]={};
    if(!sysMap[item.system][item.aor])sysMap[item.system][item.aor]={};
    sysMap[item.system][item.aor][item.period]=item.score;
  });

  allBlocks=Object.entries(sysMap).map(([sys,aors])=>({
    system:sys,
    rows:Object.entries(aors).map(([aor,weekScores])=>({
      aor,
      isRating:aor==='RATING',
      scores:periods.map(period=>weekScores[period]!==undefined?weekScores[period]:null),
    })),
  }));

  // Populate system selector
  const ss=document.getElementById('sys-sel'),selectedSystem=ss.value;
  ss.replaceChildren(new Option('All Systems'),...allBlocks.map(b=>new Option(b.system)));
  ss.value=allBlocks.some(b=>b.system===selectedSystem)?selectedSystem:'All Systems';

  updateCards();
  renderView();
}

function cwToMonth(cw){
  const n=parseInt(cw.replace('CW',''));
  const months=['','JAN','JAN','JAN','JAN','JAN','FEB','FEB','FEB','FEB',
    'MAR','MAR','MAR','MAR','APR','APR','APR','APR','MAY','MAY','MAY','MAY',
    'JUN','JUN','JUN','JUN','JUL','JUL','JUL','JUL','JUL','AUG','AUG','AUG',
    'AUG','SEP','SEP','SEP','SEP','SEP','OCT','OCT','OCT','OCT','NOV','NOV',
    'NOV','NOV','DEC','DEC','DEC','DEC','DEC'];
  return months[n]||'';
}

// ════════════════════════════════════════════════════════
//  HELPERS
// ════════════════════════════════════════════════════════
const iv=v=>v!=null&&v!==''&&!isNaN(parseFloat(v));
function lv(a){for(let i=a.length-1;i>=0;i--)if(iv(a[i]))return parseFloat(a[i]);return null;}
function sc(v){
  if(!iv(v))return{bg:'#e9edf3',fg:'#8b96a8',cl:'sn'};
  const f=parseFloat(v);
  if(f>=61)return{bg:'rgba(52,211,153,.15)',fg:'#16a34a',cl:'sg',hex:'#16a34a'};
  if(f>=35)return{bg:'rgba(251,191,36,.15)',fg:'#d97706',cl:'sw',hex:'#d97706'};
  return{bg:'rgba(220,38,38,.16)',fg:'#b91c1c',cl:'sr',hex:'#dc2626'};
}
function gb(){const s=document.getElementById('sys-sel').value;return s==='All Systems'?allBlocks:allBlocks.filter(b=>b.system===s);}
function gc(){return allColumns.slice(-cwLimit);}
function es(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}


function latS(){const d={};for(const b of allBlocks)for(const r of b.rows){if(r.isRating)continue;const v=lv(r.scores);if(v!==null){if(!d[r.aor])d[r.aor]=[];d[r.aor].push(v);}}const o={};for(const[a,vs]of Object.entries(d))o[a]=vs.reduce((a,b)=>a+b,0)/vs.length;return o;}
function ovAvg(){const vs=[];for(const b of allBlocks)for(const r of b.rows)if(r.isRating){const v=lv(r.scores);if(v!==null)vs.push(v);}return vs.length?Math.round(vs.reduce((a,b)=>a+b,0)/vs.length):null;}

function updateCards(){
  const as=latS(),n=Object.keys(as).length,ov=ovAvg();
  const cr=Object.values(as).filter(v=>v<=34).length;
  const st=Object.values(as).filter(v=>v>=61).length;
  const avg=n?Math.round(Object.values(as).reduce((a,b)=>a+b,0)/n):null;
  document.getElementById('k1').textContent=ov??'--';
  document.getElementById('k2').textContent=avg??'--';
  document.getElementById('k2s').textContent=`${n} areas tracked`;
  document.getElementById('k3').textContent=cr;
  document.getElementById('k4').textContent=st;
}

function setLeg(items){document.getElementById('legend').innerHTML=items.map(([bg,fg,l])=>`<span class="lpill" style="background:${bg};color:${fg}">${l}</span>`).join('');}

// ════════════════════════════════════════════════════════
//  NAV
// ════════════════════════════════════════════════════════
function buildNav(){
  const el=document.getElementById('nav-items');
  el.innerHTML=VIEWS.map(v=>`<button type="button" class="nav-item${v.key===activeView?' active':''}" data-key="${v.key}" aria-current="${v.key===activeView?'page':'false'}"><span class="nav-icon" aria-hidden="true">${v.icon}</span>${v.label}</button>`).join('');
  el.querySelectorAll('.nav-item').forEach(item=>item.addEventListener('click',()=>{
    activeView=item.dataset.key;
    el.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));
    item.classList.add('active');
    el.querySelectorAll('.nav-item').forEach(i=>i.setAttribute('aria-current',i===item?'page':'false'));
    document.getElementById('vt-hdr').textContent=VIEWS.find(v=>v.key===activeView).label;
    renderView();
  }));
}

// ════════════════════════════════════════════════════════
//  VIEW ROUTER
// ════════════════════════════════════════════════════════
function renderView(){
  if(!allBlocks.length){showWelcome();return;}
  document.getElementById('chart-host').style.display='none';
  document.getElementById('html-host').style.display='none';
  document.getElementById('html-host').classList.remove('flush');
  chartInsts.forEach(c=>{try{c.destroy();}catch(e){}});chartInsts=[];
  document.getElementById('vt').textContent=VIEWS.find(v=>v.key===activeView)?.label?.toUpperCase()||'';
  setLeg([]);
  switch(activeView){case 'overview':vOverviewMega();break;case 'wowspark':vWowSpark();break;}
}
function sHtml(h){const el=document.getElementById('html-host');el.style.display='block';el.innerHTML=h;}
function sHtmlFlush(h){const el=document.getElementById('html-host');el.style.display='block';el.classList.add('flush');el.innerHTML=h;}
function sChart(){document.getElementById('chart-host').style.display='block';const o=document.getElementById('mc');if(o)o.remove();const c=document.createElement('canvas');c.id='mc';document.querySelector('.chart-container').appendChild(c);}
function showWelcome(){
  const h=document.getElementById('html-host');h.style.display='block';
  h.innerHTML=`<div class="welcome">
    <div class="welcome-icon">🛡️</div>
    <div class="welcome-title">SecurityBridge S&amp;C Tracker</div>
    <div class="welcome-sub">Sign in with your Vestas Microsoft 365 account to load all historical security scores from SharePoint automatically.</div>
    <button class="welcome-btn" onclick="doSignIn()">
      <svg class="ms-logo" viewBox="0 0 21 21" fill="none"><rect width="10" height="10" fill="#f25022"/><rect x="11" width="10" height="10" fill="#7fba00"/><rect y="11" width="10" height="10" fill="#00a4ef"/><rect x="11" y="11" width="10" height="10" fill="#ffb900"/></svg>
      Sign in with Microsoft
    </button>
    <div style="font-size:11px;color:var(--fg3);margin-top:14px">Shows CW01 onwards — full history from SharePoint</div>
  </div>`;
}

// ════════════════════════════════════════════════════════
//  RANKING — latest RATING per system (all systems)
// ════════════════════════════════════════════════════════
function buildSystemRankHtml(){
  const ranked=allBlocks.map(b=>{
    const rr=b.rows.find(r=>r.isRating);
    const v=rr?lv(rr.scores):null;
    return {name:b.system,score:v};
  }).sort((a,b)=>(b.score??-1)-(a.score??-1));
  if(!ranked.length)return '<li>No systems loaded</li>';
  return ranked.map(item=>{
    const tone=item.score===null?'empty':item.score>=61?'good':item.score>=35?'warning':'critical';
    const hex=item.score===null?'#8b96a8':item.score>=61?'#16a34a':item.score>=35?'#d97706':'#dc2626';
    const pct=item.score===null?0:Math.max(2,Math.round(item.score));
    return `<li><span class="sys-bar-name" title="${es(item.name)}">${es(item.name)}</span><span class="sys-bar-track"><span class="sys-bar-fill" style="width:${pct}%;background:${hex}"></span></span><span class="rating-pill ${tone}">${item.score===null?'—':Math.round(item.score)}</span></li>`;
  }).join('');
}

// ════════════════════════════════════════════════════════
//  HEATMAP PANEL (used inside merged Overview)
// ════════════════════════════════════════════════════════
function setHeatmapSystem(system){
  document.getElementById('sys-sel').value=system;
  renderView();
}
function buildHeatmapHtml(){
  const systemControl=document.getElementById('sys-sel');
  if(systemControl.value==='All Systems'&&allBlocks.length)systemControl.value=allBlocks[0].system;
  const block=allBlocks.find(item=>item.system===systemControl.value),cols=gc().slice().reverse();
  if(!block)return '<div style="padding:60px;text-align:center;color:var(--fg3)">No system data</div>';
  const mg=[];let cm=null,ms=0;
  for(let i=0;i<cols.length;i++){if(cols[i].month!==cm){if(cm!==null)mg.push({mo:cm,s:ms,e:i-1});cm=cols[i].month;ms=i;}}
  if(cm!==null)mg.push({mo:cm,s:ms,e:cols.length-1});
  const multiYear=[...new Set(cols.map(c=>c.year))].length>1;
  let h=`<div class="heatmap-layout"><section class="heatmap-main"><div class="heatmap-toolbar"><label for="heatmap-system">System<select id="heatmap-system" onchange="setHeatmapSystem(this.value)">${allBlocks.map(item=>`<option value="${es(item.system)}"${item.system===block.system?' selected':''}>${es(item.system)}</option>`).join('')}</select></label><span class="heatmap-hint">Weekly score history for the selected system</span></div><div class="hm-wrap"><table class="hm"><thead>
  <tr class="mo-row"><th class="at">Area of Responsibility</th>`;
  mg.forEach(({mo,s,e})=>{
    const yr=cols[s]?.year||'';
    h+=`<th colspan="${e-s+1}" style="border-left:2px solid #00b5e4">${mo||''}${multiYear?' '+yr:''}</th>`;
  });
  h+=`</tr><tr class="cw-row"><th class="at"></th>`;
  for(let i=0;i<cols.length;i++){const bl=i>0&&cols[i].month!==cols[i-1].month?'border-left:2px solid #dfe4ec':'';h+=`<th style="${bl}">${cols[i].cw}</th>`;}
  h+=`</tr></thead><tbody>`;
  for(const r of block.rows){
    h+=`<tr class="dr"><td class="at${r.isRating?' ir':''}">${es(r.aor)}</td>`;
    for(let ci=0;ci<cols.length;ci++){
      const v=r.scores[cols[ci].index]??null;
      const s2=sc(v);const bl=ci>0&&cols[ci].month!==cols[ci-1].month?'border-left:2px solid #dfe4ec':'';
      h+=`<td style="${bl}"><span class="sc ${s2.cl}">${iv(v)?Math.round(v):'—'}</span></td>`;
    }
    h+=`</tr>`;
  }
  const ratingRow=block.rows.find(row=>row.isRating),rating=ratingRow?lv(ratingRow.scores):null;
  const tone=rating===null?'empty':rating>=61?'good':rating>=35?'warning':'critical';
  const aors=block.rows.filter(row=>!row.isRating).map(row=>({name:row.aor,score:lv(row.scores)}));
  const good=aors.filter(item=>item.score!==null&&item.score>=61).length,warning=aors.filter(item=>item.score!==null&&item.score>=35&&item.score<61).length,critical=aors.filter(item=>item.score!==null&&item.score<35).length;
  const list=aors.sort((a,b)=>(a.score??101)-(b.score??101)).map(item=>{const itemTone=item.score===null?'empty':item.score>=61?'good':item.score>=35?'warning':'critical';return `<li><span>${es(item.name)}</span><span class="rating-pill ${itemTone}">${item.score===null?'—':Math.round(item.score)}</span></li>`;}).join('');
  h+=`</tbody></table></div></section><aside class="rating-summary"><h3>Latest rating summary</h3><div class="rs-cols"><div class="rs-col"><div class="rating-score ${tone}"><div class="score">${rating===null?'—':Math.round(rating)}</div><div class="label">Overall rating — ${es(block.system)}</div></div><div class="rating-counts"><div class="rating-count critical"><strong>${critical}</strong><span>Critical</span></div><div class="rating-count warning"><strong>${warning}</strong><span>Warning</span></div><div class="rating-count good"><strong>${good}</strong><span>Good</span></div></div><div class="rating-list-title">Latest AoR scores</div><ul class="rating-list">${list||'<li>No Area of Responsibility scores</li>'}</ul></div><div class="rs-col"><div class="rating-list-title">Latest rating by system</div><ul class="rating-list systems">${buildSystemRankHtml()}</ul></div></div></aside></div>`;
  return h;
}

// ════════════════════════════════════════════════════════
//  CHART BUILDERS (targeted at a given canvas, for merged pages)
// ════════════════════════════════════════════════════════
function buildPostureChart(canvas){
  const cols=gc(),blocks=allBlocks;
  const posture=cols.map(column=>{
    const ratings=blocks.flatMap(block=>block.rows.filter(row=>row.isRating).map(row=>row.scores[column.index])).filter(iv).map(Number);
    const fallback=blocks.flatMap(block=>block.rows.filter(row=>!row.isRating).map(row=>row.scores[column.index])).filter(iv).map(Number);
    const values=ratings.length?ratings:fallback;
    return values.length?values.reduce((sum,value)=>sum+value,0)/values.length:null;
  });
  chartInsts.push(new Chart(canvas.getContext('2d'),{
    type:'line',data:{labels:cols.map(column=>`${column.cw} ${column.year}`),datasets:[{label:'Overall security posture',data:posture,borderColor:'#00b5e4',backgroundColor:'rgba(0,181,228,.15)',fill:true,pointRadius:2,pointHoverRadius:5,borderWidth:2,tension:.3,spanGaps:true}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:context=>`Overall score: ${context.parsed.y===null?'—':Math.round(context.parsed.y)}`}}},scales:{y:{min:0,max:100,grid:{color:'#e4e9f0'},ticks:{font:{size:11}}},x:{grid:{display:false},ticks:{font:{size:10},maxRotation:0,autoSkip:true,maxTicksLimit:10}}}}
  }));
}
function buildTrendChart(canvas){
  const blocks=gb(),cols=gc(),allSys=document.getElementById('sys-sel').value==='All Systems';
  const labels=cols.map(c=>c.cw);let series=[];
  if(allSys){
    const acc={};for(const b of blocks)for(const r of b.rows){if(r.isRating)continue;if(!acc[r.aor])acc[r.aor]=[];acc[r.aor].push(r.scores);}
    for(const[a,sls]of Object.entries(acc)){const pts=cols.map((_,i)=>{const vs=sls.map(sl=>i<sl.length&&iv(sl[i])?parseFloat(sl[i]):null).filter(v=>v!==null);return vs.length?vs.reduce((a,b)=>a+b,0)/vs.length:null;});if(pts.some(v=>v!==null))series.push({label:a,data:pts});}
  }else{for(const b of blocks)for(const r of b.rows){if(r.isRating)continue;const pts=cols.map((_,i)=>i<r.scores.length&&iv(r.scores[i])?parseFloat(r.scores[i]):null);if(pts.some(v=>v!==null))series.push({label:r.aor,data:pts});}}
  if(!series.length)return;
  chartInsts.push(new Chart(canvas.getContext('2d'),{
    type:'line',data:{labels,datasets:series.map((s,i)=>({label:s.label,data:s.data,borderColor:CC[i%CC.length],backgroundColor:CC[i%CC.length]+'22',pointRadius:1,pointHoverRadius:4,borderWidth:1.5,tension:0.3,spanGaps:true}))},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'nearest',intersect:false},
      plugins:{legend:{display:true,position:'bottom',labels:{boxWidth:11,font:{size:10},padding:6}},tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${c.parsed.y!==null?Math.round(c.parsed.y):'—'}`}}},
      scales:{y:{min:0,max:100,grid:{color:'#e4e9f0'},ticks:{font:{size:11}}},x:{grid:{display:false},ticks:{font:{size:10},maxRotation:45,autoSkip:true,maxTicksLimit:14}}}}
  }));
}
function buildWeakestChart(canvas){
  const sel=document.getElementById('sys-sel').value,allSys=sel==='All Systems';
  const blocks=gb();let data=[];
  if(allSys){const acc={};for(const b of blocks)for(const r of b.rows){if(r.isRating)continue;const v=lv(r.scores);if(v===null)continue;if(!acc[r.aor])acc[r.aor]=[];acc[r.aor].push(v);}for(const[a,vs]of Object.entries(acc))data.push({aor:a,score:vs.reduce((a,b)=>a+b,0)/vs.length});}
  else{for(const b of blocks)for(const r of b.rows){if(r.isRating)continue;const v=lv(r.scores);if(v===null)continue;data.push({aor:r.aor,score:v});}}
  data.sort((a,b)=>a.score-b.score);data=data.slice(0,10);
  if(!data.length)return;
  chartInsts.push(new Chart(canvas.getContext('2d'),{
    type:'bar',data:{labels:data.map(d=>d.aor.length>26?d.aor.slice(0,26)+'…':d.aor),datasets:[{data:data.map(d=>Math.round(d.score)),backgroundColor:data.map(d=>d.score<=34?'#dc2626':d.score<=60?'#d97706':'#16a34a'),borderRadius:4}]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`Score: ${c.parsed.x}`}}},scales:{x:{min:0,max:100,grid:{color:'#e4e9f0'},ticks:{font:{size:11}}},y:{grid:{display:false},ticks:{font:{size:12}}}}}
  }));
}
function buildCritChart(canvas){
  const blocks=gb(),systems=[];
  for(const b of blocks){let g=0,w=0,c=0;for(const r of b.rows){if(r.isRating)continue;const v=lv(r.scores);if(v===null)continue;if(v>=61)g++;else if(v>=35)w++;else c++;}if(g+w+c>0)systems.push({name:b.system,g,w,c,t:g+w+c});}
  if(!systems.length)return;
  chartInsts.push(new Chart(canvas.getContext('2d'),{
    type:'bar',data:{labels:systems.map(s=>s.name.length>10?s.name.slice(0,10)+'…':s.name),datasets:[{label:'Critical (≤34)',data:systems.map(s=>Math.round(s.c/s.t*100)),backgroundColor:'#dc2626',borderRadius:0},{label:'Warning (35–60)',data:systems.map(s=>Math.round(s.w/s.t*100)),backgroundColor:'#d97706',borderRadius:0},{label:'Good (61+)',data:systems.map(s=>Math.round(s.g/s.t*100)),backgroundColor:'#16a34a',borderRadius:0}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true,position:'top',labels:{boxWidth:11,font:{size:11},padding:6}},tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${c.parsed.y}%`}}},scales:{x:{stacked:true,grid:{display:false},ticks:{font:{size:10},maxRotation:45,autoSkip:true}},y:{stacked:true,min:0,max:100,grid:{color:'#e4e9f0'},ticks:{callback:v=>v+'%',font:{size:11}}}}}
  }));
}

// ════════════════════════════════════════════════════════
//  MERGED VIEW — OVERVIEW (heatmap + posture + trend + weakest + critical)
// ════════════════════════════════════════════════════════
function vOverviewMega(){
  const h=`<div class="ov-grid">
    <section class="ov-panel ov-heatmap">${buildHeatmapHtml()}</section>
    <section class="ov-panel"><div class="ov-panel-hd"><h3>Overall Posture Trend</h3></div><div class="ov-chart"><canvas id="ov-posture"></canvas></div></section>
    <section class="ov-panel"><div class="ov-panel-hd"><h3>Trend Lines by AoR</h3><div class="ov-panel-leg"><span class="lpill" style="background:rgba(220,38,38,.15);color:#b91c1c">Critical</span><span class="lpill" style="background:rgba(251,191,36,.15);color:#d97706">Warning</span></div></div><div class="ov-chart"><canvas id="ov-trend"></canvas></div></section>
    <section class="ov-panel"><div class="ov-panel-hd"><h3>Weakest AoRs</h3></div><div class="ov-chart"><canvas id="ov-weakest"></canvas></div></section>
    <section class="ov-panel"><div class="ov-panel-hd"><h3>Critical by System</h3></div><div class="ov-chart"><canvas id="ov-crit"></canvas></div></section>
  </div>`;
  sHtmlFlush(h);
  buildPostureChart(document.getElementById('ov-posture'));
  buildTrendChart(document.getElementById('ov-trend'));
  buildWeakestChart(document.getElementById('ov-weakest'));
  buildCritChart(document.getElementById('ov-crit'));
}

// ════════════════════════════════════════════════════════
//  MERGED VIEW — WEEK-OVER-WEEK Δ + SPARKLINES
// ════════════════════════════════════════════════════════
function buildWowHtml(){
  const blocks=gb(),cols=gc(),allSys=document.getElementById('sys-sel').value==='All Systems';
  let dc=[];for(let i=1;i<cols.length;i++)dc.push({p:cols[i-1],c:cols[i]});
  dc=dc.slice(-Math.min(8,dc.length));
  if(!dc.length)return '<div style="padding:40px;text-align:center;color:var(--fg3)">Need at least 2 weeks</div>';
  const im=new Map();allColumns.forEach((c,i)=>im.set(c,i));
  let h=`<table class="wow"><thead><tr><th class="wa">Area of Responsibility</th>${dc.map(d=>`<th>${d.p.cw}→${d.c.cw}</th>`).join('')}</tr></thead><tbody>`;
  for(const b of blocks){
    if(allSys)h+=`<tr class="ws"><td colspan="${dc.length+1}">▸  ${es(b.system)}</td></tr>`;
    for(const r of b.rows){
      h+=`<tr class="wr"><td class="wac${r.isRating?' ir':''}">${es(r.aor)}</td>`;
      for(const d of dc){
        const pi=im.get(d.p)??-1,ci=im.get(d.c)??-1;
        const pv=pi>=0&&pi<r.scores.length?r.scores[pi]:null;
        const cv=ci>=0&&ci<r.scores.length?r.scores[ci]:null;
        if(iv(pv)&&iv(cv)){const dv=parseFloat(cv)-parseFloat(pv);const cl=dv>0?'du':dv<0?'dd':'de';h+=`<td><span class="dp ${cl}">${dv>0?`▲ +${Math.round(dv)}`:dv<0?`▼ ${Math.round(dv)}`:'● 0'}</span></td>`;}
        else h+=`<td><span class="dp dn">--</span></td>`;
      }
      h+=`</tr>`;
    }
  }
  return h+`</tbody></table>`;
}
function buildSparkHtml(){
  const blocks=gb(),cols=gc(),allSys=document.getElementById('sys-sel').value==='All Systems';
  const SW=140,SH=26;
  let h=`<table class="spk"><thead><tr><th class="sa">Area of Responsibility</th><th style="min-width:${SW}px">Sparkline</th><th>Last 4wk</th><th>Latest</th><th>Trend</th><th>Δ 2wk</th></tr></thead><tbody>`;
  for(const b of blocks){
    if(allSys)h+=`<tr class="ss"><td colspan="6">▸  ${es(b.system)}</td></tr>`;
    for(const r of b.rows){
      const vals=cols.map((_,i)=>i<r.scores.length&&iv(r.scores[i])?parseFloat(r.scores[i]):null);
      const vpts=vals.map((v,i)=>v!==null?{x:i,y:v}:null).filter(Boolean);
      const latest=lv(vals);const s2=sc(latest);
      const l4=vals.filter(v=>v!==null).slice(-4);
      const p2=vals.filter(v=>v!==null).slice(-2);
      let tr='—';if(l4.length>=2){const sl=l4[l4.length-1]-l4[0];tr=sl>3?`<span class="strend" style="color:#16a34a">↑</span>`:sl<-3?`<span class="strend" style="color:#dc2626">↓</span>`:`<span class="strend" style="color:#8b96a8">→</span>`;}
      let dp='--';if(p2.length===2){const d=p2[1]-p2[0];const cl=d>0?'du':d<0?'dd':'de';dp=`<span class="dp ${cl}">${d>0?`▲+${Math.round(d)}`:d<0?`▼${Math.round(d)}`:'●0'}</span>`;}
      const l4W=l4.length*15;
      const l4s=`<svg width="${l4W}" height="26" viewBox="0 0 ${l4W} 26">${l4.map((v,i)=>{const c=sc(v);const ht=Math.max(2,Math.round((v/100)*22));return `<g transform="translate(${i*15},0)"><rect x="0" y="${24-ht}" width="12" height="${ht}" rx="2" fill="${c.hex||c.bg}"/></g>`;}).join('')}</svg>`;
      let svg=`<svg width="${SW}" height="${SH}" viewBox="0 0 ${SW} ${SH}">`;
      if(vpts.length>=2){const xr=Math.max(vpts[vpts.length-1].x-vpts[0].x,1);const pts=vpts.map(p=>({px:(((p.x-vpts[0].x)/xr)*(SW-8))+4,py:SH-4-((p.y/100)*(SH-8))}));const lc=vpts[vpts.length-1].y>=61?'#16a34a':vpts[vpts.length-1].y>=35?'#d97706':'#dc2626';svg+=`<polygon points="${pts[0].px},${SH-2} ${pts.map(p=>`${p.px},${p.py}`).join(' ')} ${pts[pts.length-1].px},${SH-2}" fill="${lc}22"/>`;svg+=`<path d="M ${pts.map(p=>`${p.px},${p.py}`).join(' L ')}" fill="none" stroke="${lc}" stroke-width="1.5" stroke-linejoin="round"/>`;const ys=vpts.map(p=>p.y),maxY=Math.max(...ys),minY=Math.min(...ys);pts.forEach((p,i)=>{if(vpts[i].y===maxY||vpts[i].y===minY)svg+=`<circle cx="${p.px}" cy="${p.py}" r="3" fill="#fff" stroke="${lc}" stroke-width="1.5"/>`;});const lp=pts[pts.length-1];svg+=`<circle cx="${lp.px}" cy="${lp.py}" r="3" fill="${lc}"/>`;}
      svg+=`</svg>`;
      h+=`<tr class="sr2"><td class="sac${r.isRating?' ir':''}">${es(r.aor)}</td><td>${svg}</td><td>${l4s}</td><td><span class="sbadge" style="background:${s2.bg};color:${s2.fg}">${latest!==null?Math.round(latest):'—'}</span></td><td style="text-align:center">${tr}</td><td style="text-align:center">${dp}</td></tr>`;
    }
  }
  return h+`</tbody></table>`;
}
function vWowSpark(){
  const h=`<div class="ws-stack">
    <section class="ov-panel"><div class="ov-panel-hd"><h3>Week-over-Week Δ</h3><div class="ov-panel-leg"><span class="lpill" style="background:rgba(52,211,153,.15);color:#16a34a">▲ Improved</span><span class="lpill" style="background:rgba(220,38,38,.15);color:#b91c1c">▼ Declined</span><span class="lpill" style="background:var(--surface3);color:var(--fg2)">● No change</span></div></div><div class="wow-wrap">${buildWowHtml()}</div></section>
    <section class="ov-panel"><div class="ov-panel-hd"><h3>Sparklines</h3><div class="ov-panel-leg"><span class="lpill" style="background:#16a34a;color:#04140d">Good</span><span class="lpill" style="background:#d97706;color:#221a03">Warning</span><span class="lpill" style="background:#dc2626;color:#fff">Critical</span></div></div><div class="spk-wrap">${buildSparkHtml()}</div></section>
  </div>`;
  sHtmlFlush(h);
}
